# Copiar como config.yaml y reemplazar únicamente con rutas locales reales.
# config.yaml está ignorado por Git.

application:
  host: "127.0.0.1"
  port: 5000
  debug: false

paths:
  # Fuentes externas: el MVP debe tratarlas como solo lectura.
  raw_roots:
    - "D:/Photography/RAW"
  lightroom_catalogs:
    - "D:/Lightroom/Catalog.lrcat"

  # Área privada de documentación de modelos, fuera del repositorio.
  model_private_root: "D:/Photography-Private/Models"

  # Salidas generadas, fuera de las carpetas fuente y del repositorio.
  workspace_root: "D:/Photography-Workflow/Workspace"
  thumbnail_cache: "D:/Photography-Workflow/Workspace/thumbnails"
  contact_sheets: "D:/Photography-Workflow/Workspace/contact-sheets"
  xmp_archive: "D:/Photography-Workflow/Workspace/xmp-archive"
  xmp_proposals: "D:/Photography-Workflow/Workspace/xmp-proposals"
  database: "D:/Photography-Workflow/Workspace/workflow.sqlite3"

processing:
  source_mode: "read_only"
  write_xmp_next_to_raw: false
  preserve_original_sidecars: true
  thumbnail_max_edge_px: 1600
  contact_sheet_columns: 5
  similarity_grouping_enabled: false

privacy:
  store_model_legal_names: false
  store_model_contact_details: false
  include_absolute_source_paths_in_logs: false
  log_level: "INFO"
